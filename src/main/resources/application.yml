spring:
  application:
    name: fineract-rafiki-connector
  datasource:
    url: jdbc:h2:mem:rafiki;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8089

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Rafiki connector defaults (override per tenant in production)
rafiki:
  connector:
    enabled: true
    default-admin-url: http://localhost:3001/graphql
    default-webhook-secret: change-me-in-production
    signature-version: "1"
    default-asset-code: USD
    default-asset-scale: 2

logging:
  level:
    org.apache.fineract.rafiki: DEBUG
    org.springframework: INFO
